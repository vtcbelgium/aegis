[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-gate"
version = "1.0.0"
description = "Deterministic Monotonic Negative Security Gate & Agentic Firewall for AI Agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Jeroen Pauwels / OTHRYS", email = "jeroen@othrys.be" }]
keywords = ["ai-security", "llm-guardrails", "agentic-firewall", "owasp", "negative-gate", "mcp-security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]
