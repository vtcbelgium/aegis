name: Publish aegis-gate to PyPI

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/aegis-gate
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
