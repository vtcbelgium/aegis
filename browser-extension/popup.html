<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aegis Shield</title>
  <style>
    :root {
      --bg: #07060f;
      --surface: #110f22;
      --field: #0b0918;
      --border: rgba(167, 139, 250, 0.16);
      --fg: #f4f4fa;
      --muted: #9390b0;
      --accent: #7c3aed;
      --ok: #34d399;
      --danger: #f43f5e;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: radial-gradient(ellipse 90% 45% at 15% 0%, rgba(168, 85, 247, 0.22), transparent 65%), var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 12px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .bar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .switch {
      width: 34px;
      height: 19px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--field);
      padding: 2px;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      transition: background 140ms ease;
    }
    .switch[data-on="true"] { background: var(--accent); border-color: var(--accent); }
    .switch span {
      width: 13px;
      height: 13px;
      border-radius: 999px;
      background: #fff;
      display: block;
      transition: transform 140ms ease;
    }
    .switch[data-on="true"] span { transform: translateX(15px); }
    .mono { font-family: var(--mono); }
    .tabular { font-variant-numeric: tabular-nums; font-weight: 600; }
    .muted { color: var(--muted); }
    .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .link-btn {
      background: none;
      border: none;
      color: var(--muted);
      font: inherit;
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .link-btn:hover { color: var(--fg); }
    .activity {
      padding: 12px 16px 14px;
    }
    .activity-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .threat-list {
      list-style: none;
      max-height: 170px;
      overflow-y: auto;
      border-top: 1px solid var(--border);
    }
    .threat-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      color: var(--danger);
      word-break: break-word;
    }
    .empty {
      padding: 10px 0;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <svg width="16" height="16" viewBox="0 0 128 128" fill="none" aria-hidden="true">
        <path d="M56 16H74L49 70L61 98H37L31 112H12L56 16Z" fill="currentColor"/>
        <path d="M77 25L116 112H95L89 98H67L79 70L66 47L77 25Z" fill="currentColor"/>
      </svg>
      <span style="letter-spacing:0.04em;">AEGIS</span>
      <span class="muted" style="font-weight:400;font-size:11px;">Shield</span>
    </div>
    <button class="switch" id="toggleProtection" data-on="true" aria-label="Toggle shield"><span></span></button>
  </div>

  <div class="bar" id="siteBar" style="display:none;">
    <span class="mono trunc" id="siteHost">-</span>
    <button class="link-btn" id="toggleSiteBtn">Trust site</button>
  </div>

  <div class="bar">
    <span class="muted">Blocked on this tab</span>
    <span class="mono tabular" id="tabThreatCount">0</span>
  </div>

  <div class="bar">
    <span class="muted">Total blocked</span>
    <span class="mono tabular" id="totalThreatCount">0</span>
  </div>

  <div class="activity">
    <div class="activity-head">
      <span id="listTitle">Activity</span>
      <button class="link-btn" id="clearHistoryBtn">Clear</button>
    </div>
    <ul class="threat-list" id="threatList">
      <li class="empty">No hidden prompt traps or tracking beacons found.</li>
    </ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
