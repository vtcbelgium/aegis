<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aegis AI Shield</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background: #0b1220;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 800;
      font-size: 15px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toggle-btn {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      border: 1px solid rgba(74, 222, 128, 0.4);
      background: rgba(74, 222, 128, 0.16);
      color: #4ade80;
    }
    .toggle-btn.paused {
      border-color: rgba(148, 163, 184, 0.4);
      background: rgba(148, 163, 184, 0.14);
      color: #cbd5e1;
    }
    .site-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .site-host {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #cbd5e1;
      font-weight: 600;
    }
    .mini-btn {
      background: rgba(56, 189, 248, 0.14);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mini-btn.muted {
      background: rgba(148, 163, 184, 0.12);
      color: #94a3b8;
      border-color: rgba(148, 163, 184, 0.25);
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-number {
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1.1;
    }
    .stat-label {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .law {
      font-size: 11px;
      font-style: italic;
      color: #94a3b8;
      border-left: 2px solid #38bdf8;
      padding-left: 8px;
      margin-bottom: 12px;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 700;
    }
    .threat-list {
      max-height: 150px;
      overflow-y: auto;
      font-size: 11px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .threat-item {
      padding: 6px 8px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.22);
      border-radius: 6px;
      margin-bottom: 6px;
      color: #fca5a5;
      word-break: break-word;
    }
    .empty { color: #64748b; font-style: italic; padding: 4px 0; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <img src="icons/icon48.png" width="20" height="20" alt="">
      Aegis AI Shield
    </div>
    <button class="toggle-btn" id="toggleProtection">SHIELD ON</button>
  </div>

  <div class="site-bar" id="siteBar" style="display:none;">
    <span class="site-host" id="siteHost">—</span>
    <button class="mini-btn" id="toggleSiteBtn">Trust Site</button>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-number" id="tabThreatCount">0</div>
      <div class="stat-label">This Tab</div>
    </div>
    <div class="stat-box">
      <div class="stat-number" id="totalThreatCount">0</div>
      <div class="stat-label">All-Time Blocked</div>
    </div>
  </div>

  <div class="law">
    &ldquo;Aegis may subtract authority. Aegis may never create it.&rdquo;
  </div>

  <div class="section-head">
    <span id="listTitle">Recent Blocked Traps</span>
    <button class="mini-btn muted" id="clearHistoryBtn">Clear</button>
  </div>
  <ul class="threat-list" id="threatList">
    <li class="empty">No hidden traps detected yet.</li>
  </ul>

  <script src="popup.js"></script>
</body>
</html>
