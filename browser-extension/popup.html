<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aegis Shield</title>
  <style>
    :root {
      --bg: #0b0d11;
      --border: rgba(255, 255, 255, 0.09);
      --fg: #f3f5f8;
      --muted: #8b94a5;
      --ok: #34d399;
      --danger: #f87171;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-size: 12px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .bar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .switch {
      width: 34px;
      height: 19px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #1a1f2b;
      padding: 2px;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      transition: background 140ms ease;
    }
    .switch[data-on="true"] { background: var(--ok); border-color: var(--ok); }
    .switch span {
      width: 13px;
      height: 13px;
      border-radius: 999px;
      background: #fff;
      display: block;
      transition: transform 140ms ease;
    }
    .switch[data-on="true"] span { transform: translateX(15px); }
    .mono { font-family: var(--mono); }
    .tabular { font-variant-numeric: tabular-nums; font-weight: 600; }
    .muted { color: var(--muted); }
    .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .link-btn {
      background: none;
      border: none;
      color: var(--muted);
      font: inherit;
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .link-btn:hover { color: var(--fg); }
    .activity {
      padding: 12px 16px 14px;
    }
    .activity-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .threat-list {
      list-style: none;
      max-height: 170px;
      overflow-y: auto;
      border-top: 1px solid var(--border);
    }
    .threat-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      color: var(--danger);
      word-break: break-word;
    }
    .empty {
      padding: 10px 0;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
        <path d="M12 2.5L4.5 5.5v6.2c0 4.9 3.1 8.8 7.5 10.3 4.4-1.5 7.5-5.4 7.5-10.3V5.5L12 2.5z"/>
        <path d="M9 12.2l2.1 2.1L15.4 10"/>
      </svg>
      <span>Aegis Shield</span>
    </div>
    <button class="switch" id="toggleProtection" data-on="true" aria-label="Toggle shield"><span></span></button>
  </div>

  <div class="bar" id="siteBar" style="display:none;">
    <span class="mono trunc" id="siteHost">-</span>
    <button class="link-btn" id="toggleSiteBtn">Trust site</button>
  </div>

  <div class="bar">
    <span class="muted">Blocked on this tab</span>
    <span class="mono tabular" id="tabThreatCount">0</span>
  </div>

  <div class="bar">
    <span class="muted">Total blocked</span>
    <span class="mono tabular" id="totalThreatCount">0</span>
  </div>

  <div class="activity">
    <div class="activity-head">
      <span id="listTitle">Activity</span>
      <button class="link-btn" id="clearHistoryBtn">Clear</button>
    </div>
    <ul class="threat-list" id="threatList">
      <li class="empty">No hidden prompt traps or tracking beacons found.</li>
    </ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
